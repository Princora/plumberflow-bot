# fly.toml — PlumberFlow WhatsApp Bot
# Docs: https://fly.io/docs/reference/configuration/
#
# Keep this file and the Dockerfile at the repo root (next to main.py).
# Run ONE machine only: the 10-minute sweeps run in-process (APScheduler),
# so a second machine would run them twice. Deploy with `fly deploy --ha=false`.

app = "plumberflow"
primary_region = "jnb"

[build]

# Start the new version beside the old one and switch only once /health says the new one works
# (started, scheduler running, database answering). A bad secret or an unreachable database then
# fails the deploy and the version that is running keeps serving. Needs a health check, below.
[deploy]
  strategy = "bluegreen"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
